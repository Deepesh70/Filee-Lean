# Build, test and check formatting on push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Filee.slnx

      - name: Check formatting
        run: dotnet format Filee.slnx --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Filee.slnx --no-restore -c Release

      - name: Restore Zig toolchain
        id: zig
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Build Explorer menu extension
        timeout-minutes: 30
        shell: pwsh
        run: ./build/build-explorer-menu.ps1

      - name: Save Zig toolchain
        if: steps.zig.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Run Core & Engine Tests
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.Cli.Tests" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore
